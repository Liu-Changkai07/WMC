<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flexbox Product Cards</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="product-container">
    <div class="product-card">
      <h3>Product 1</h3>
      <p>A fantastic item you'll love.</p>
      <div class="price">$19.99</div>
    </div>
    <div class="product-card featured">
      <h3>Product 2</h3>
      <p>Another great choice for everyone.</p>
      <div class="price">$29.99</div>
    </div>
    <div class="product-card">
      <h3>Product 3</h3>
      <p>Perfect for daily use.</p>
      <div class="price">$24.99</div>
    </div>
    <div class="product-card">
      <h3>Product 4</h3>
      <p>Top quality at a fair price.</p>
      <div class="price">$34.99</div>
    </div>
    <div class="product-card">
      <h3>Product 5</h3>
      <p>A customer favorite.</p>
      <div class="price">$14.99</div>
    </div>
    <div class="product-card">
      <h3>Product 6</h3>
      <p>Limited edition item.</p>
      <div class="price">$39.99</div>
    </div>
  </div>
</body>
</html>
